name: check
on:
  push:
  pull_request:
  schedule:
  - cron: 45 4 * * 0
permissions: {}
jobs:
  check:
    runs-on: "${{ matrix.os }}"
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - ubuntu-22.04-arm
        - macos-15-intel
        - macos-15
        ruby:
        - '2.7'
        - '3.2'
        - '3.3'
        - '3.4'
        - '4.0'
        - jruby-9.4
        - jruby-10.1
      fail-fast: false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      with:
        ruby-version: "${{ matrix.ruby }}"
        bundler-cache: true
    - run: make test
    - run: bundle exec image_optim --info
    - run: bundle exec rspec
